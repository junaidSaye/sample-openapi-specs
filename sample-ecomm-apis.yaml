  /checkout:
    post:
      tags:
        - Checkout
      summary: Checkout and place order (Customer)
      description: |
        Process checkout and create an order from the user's cart items. This is the **primary endpoint for order creation**.
        
        **Requires User Login (Customer):**
        - Login using `/auth/login` with a customer account (e.g., `user1@example.com`)
        - Use the customer bearer token in the Authorization header
        - This endpoint is part of the customer workflow: Browse → Add to Cart → Checkout → Order Created
        
        **Important Notes:**
        - Requires authentication (Bearer token from customer login)
        - Cart must not be empty - returns 400 if cart is empty
        - Use a valid address_id from the user's saved addresses (/addresses endpoint)
        - Order is created with status `pending` - admins will process it using `/admin/orders/{orderId}/status`
        - payment_method_id is currently accepted but not validated (for future payment integration)
        - Cart will be cleared after successful checkout
        - Order total is calculated automatically from cart items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id, payment_method_id]
              properties:
                address_id:
                  type: string
                  format: uuid
                  description: UUID of a saved address from /addresses endpoint (must belong to authenticated user)
                  example: "a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                payment_method_id:
                  type: string
                  description: Payment method identifier (currently accepted but not validated)
                  example: "p1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
            example:
              address_id: "a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
              payment_method_id: "p1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                items:
                  - id: "c1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                    user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                    product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
                    quantity: 2
                total_amount: 182.74
                status: "pending"
                created_at: "2025-05-31T10:00:00Z"
                updated_at: "2025-05-31T10:00:00Z"
