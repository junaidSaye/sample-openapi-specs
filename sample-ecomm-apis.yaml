openapi: 3.1.0
info:
  title: E-commerce API
  version: 1.2.0
  description: |
    This is a realistic e-commerce API with product reviews, wishlist, and enhanced search capabilities.
    
servers:
  - url: https://api.ratl.app/ecommerce
    description: Production server
  - url: http://localhost:3001
    description: Local development server
tags:
  - name: Authentication
    description: |
      User registration and authentication endpoints for both regular customers and administrators.
      
      **Important**: 
      - `/auth/register` creates customer accounts (for order creation)
      - `/auth/login` with customer credentials → user access (browse, cart, checkout, view orders)
      - `/auth/login` with admin credentials → admin access (order processing, status updates)
      - Admin accounts: register with email containing 'admin'
  - name: Products
    description: Product browsing and details
  - name: Cart
    description: Shopping cart management
  - name: Checkout
    description: Order checkout and creation
  - name: Orders
    description: Order management and history
  - name: Addresses
    description: Shipping address management
  - name: Reviews
    description: Product reviews and ratings management
  - name: Wishlist
    description: User wishlist management for saving favorite products
  - name: Admin
    description: |
      Administrative endpoints for order management and processing.
      
      **Requires Admin Login**: All endpoints in this section require authentication with an admin account.
      - Admin accounts have emails containing 'admin' (case-insensitive) OR are listed in ADMIN_EMAILS environment variable
      - Use `/auth/login` with admin credentials to get an admin bearer token
      - Admin endpoints allow order status updates following the workflow: pending → invoiced → dispatched → in_transit → out_for_delivery → delivered
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      required: [id, name, price, stock, category]
      properties:
        id:
          type: string
          format: uuid
          example: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        name:
          type: string
          example: "Worry Management"
        description:
          type: string
          example: "A book to help manage stress."
        price:
          type: number
          format: float
          example: 91.37
        category:
          type: string
          example: "books"
        image_url:
          type: string
          format: uri
          example: "https://dummyimage.com/766x809"
        stock:
          type: integer
          example: 94
        average_rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          description: Average rating from all reviews (0-5 scale)
          example: 4.5
        review_count:
          type: integer
          description: Total number of reviews for this product
          example: 23
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
      example:
        id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        name: "Worry Management"
        description: "A book to help manage stress."
        price: 91.37
        category: "books"
        image_url: "https://dummyimage.com/766x809"
        stock: 94
        average_rating: 4.5
        review_count: 23
        created_at: "2025-05-31T10:00:00Z"
        updated_at: "2025-05-31T10:00:00Z"
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        id:
          type: string
          format: uuid
          example: "c1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id:
          type: string
          format: uuid
          example: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        quantity:
          type: integer
          minimum: 1
          example: 2
      example:
        id: "c1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        quantity: 2
    Address:
      type: object
      required: [id, user_id, line1, city, state, postal_code, country]
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        line1:
          type: string
          example: "123 Main St"
        line2:
          type: string
          example: "Apt 4B"
        city:
          type: string
          example: "Springfield"
        state:
          type: string
          example: "IL"
        postal_code:
          type: string
          example: "62701"
        country:
          type: string
          example: "USA"
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
      example:
        id: "a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        line1: "123 Main St"
        line2: "Apt 4B"
        city: "Springfield"
        state: "IL"
        postal_code: "62701"
        country: "USA"
        created_at: "2025-05-31T10:00:00Z"
        updated_at: "2025-05-31T10:00:00Z"
    Order:
      type: object
      required: [id, user_id, items, total_amount, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          example:
            - id: "c1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
              user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
              product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
              quantity: 2
        total_amount:
          type: number
          example: 182.74
        status:
          type: string
          enum: [pending, invoiced, dispatched, in_transit, out_for_delivery, delivered]
          description: |
            Order status follows a strict sequential flow:
            - pending → invoiced → dispatched → in_transit → out_for_delivery → delivered
          example: "pending"
        invoice_number:
          type: string
          description: Optional invoice number (typically set when status changes to 'invoiced')
          example: "INV-2025-001"
        tracking_number:
          type: string
          description: Optional tracking number for shipment (typically set when status changes to 'dispatched')
          example: "TRACK123456789"
        invoiced_at:
          type: string
          format: date-time
          description: Timestamp when order was invoiced (auto-set when status changes to 'invoiced')
          example: "2025-05-31T11:00:00Z"
        dispatched_at:
          type: string
          format: date-time
          description: Timestamp when order was dispatched (auto-set when status changes to 'dispatched')
          example: "2025-05-31T12:00:00Z"
        in_transit_at:
          type: string
          format: date-time
          description: Timestamp when order entered transit (auto-set when status changes to 'in_transit')
          example: "2025-05-31T13:00:00Z"
        out_for_delivery_at:
          type: string
          format: date-time
          description: Timestamp when order went out for delivery (auto-set when status changes to 'out_for_delivery')
          example: "2025-06-01T09:00:00Z"
        delivered_at:
          type: string
          format: date-time
          description: Timestamp when order was delivered (auto-set when status changes to 'delivered')
          example: "2025-06-01T14:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        status_history:
          type: array
          description: Array of status change history (included in order details response)
          items:
            $ref: '#/components/schemas/OrderStatusHistory'
      example:
        id: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        items:
          - id: "c1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
            user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
            product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
            quantity: 2
        total_amount: 182.74
        status: "pending"
        created_at: "2025-05-31T10:00:00Z"
        updated_at: "2025-05-31T10:00:00Z"
    OrderStatusHistory:
      type: object
      required: [id, order_id, new_status, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: "h1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        order_id:
          type: string
          format: uuid
          example: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        old_status:
          type: string
          nullable: true
          description: Previous status (null for initial status)
          example: "pending"
        new_status:
          type: string
          enum: [pending, invoiced, dispatched, in_transit, out_for_delivery, delivered]
          example: "invoiced"
        changed_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who made the change (null for system changes)
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        notes:
          type: string
          nullable: true
          description: Optional admin notes about the status change
          example: "Invoice generated and sent to customer"
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T11:00:00Z"
      example:
        id: "h1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        order_id: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        old_status: "pending"
        new_status: "invoiced"
        changed_by: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        notes: "Invoice generated"
        created_at: "2025-05-31T11:00:00Z"
    User:
      type: object
      required: [id, email, password]
      properties:
        id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        email:
          type: string
          format: email
          description: |
            User email address. 
            - Customer emails: `user1@example.com`, `customer@example.com`
            - Admin emails: `admin@example.com`, `admin.user@example.com` (contains 'admin' for admin privileges)
          example: "user1@example.com"
        password:
          type: string
          example: "$2b$10$hashedpassword"
        name:
          type: string
          example: "User One"
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
      examples:
        customer_user:
          summary: Customer User Example
          description: Example of a regular customer account
          value:
            id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
            email: "user1@example.com"
            password: "$2b$10$hashedpassword"
            name: "John Doe"
            created_at: "2025-05-31T10:00:00Z"
            updated_at: "2025-05-31T10:00:00Z"
        admin_user:
          summary: Admin User Example
          description: Example of an admin account (email contains 'admin')
          value:
            id: "a1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
            email: "admin@example.com"
            password: "$2b$10$hashedpassword"
            name: "Admin User"
        created_at: "2025-05-31T10:00:00Z"
        updated_at: "2025-05-31T10:00:00Z"
    Review:
      type: object
      required: [id, product_id, user_id, rating, comment]
      properties:
        id:
          type: string
          format: uuid
          example: "r1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id:
          type: string
          format: uuid
          example: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        user_id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating from 1 (poor) to 5 (excellent)
          example: 5
        comment:
          type: string
          description: Review text comment
          example: "Excellent product! Highly recommend."
        user_name:
          type: string
          description: Name of the user who wrote the review
          example: "John Doe"
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
      example:
        id: "r1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        rating: 5
        comment: "Excellent product! Highly recommend."
        user_name: "John Doe"
        created_at: "2025-05-31T10:00:00Z"
        updated_at: "2025-05-31T10:00:00Z"
    WishlistItem:
      type: object
      required: [id, user_id, product_id]
      properties:
        id:
          type: string
          format: uuid
          example: "w1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id:
          type: string
          format: uuid
          example: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id:
          type: string
          format: uuid
          example: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        product:
          $ref: '#/components/schemas/Product'
          description: Full product details (included when fetching wishlist)
        created_at:
          type: string
          format: date-time
          example: "2025-05-31T10:00:00Z"
      example:
        id: "w1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
        product_id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
        created_at: "2025-05-31T10:00:00Z"
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Create a new user account (Customer or Admin)
      description: |
        Register a new user account. This endpoint can create both **customer accounts** and **admin accounts**.
        
        **Customer Account Registration:**
        - Use regular email addresses (e.g., `user1@example.com`, `customer@example.com`)
        - These accounts are for customers to browse products, manage cart, and create orders
        - For testing, use randomly generated emails to avoid conflicts: `user-{timestamp}@example.com` or `test-{uuid}@test.com`
        
        **Admin Account Registration:**
        - Use an email containing 'admin' (case-insensitive) to automatically grant admin privileges
        - Examples: `admin@example.com`, `admin.user@example.com`, `superadmin@example.com`
        - Alternatively, add the email to ADMIN_EMAILS environment variable after registration
        - Admin accounts can access all customer endpoints PLUS admin endpoints for order processing
        
        **Important Notes:**
        - The email must be unique - duplicate emails will return a 409 conflict error
        - Password will be hashed using bcrypt before storage
        - Upon successful registration, you'll receive a JWT token valid for 7 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: |
                    Unique email address. 
                    - For customer accounts: Use regular emails (e.g., `user1@example.com`, `customer@example.com`)
                    - For admin accounts: Use email containing 'admin' (e.g., `admin@example.com`, `admin.user@example.com`)
                password:
                  type: string
                  format: password
                  description: Password will be hashed using bcrypt before storage. Minimum length recommended.
                name:
                  type: string
                  description: Optional display name for the user
            examples:
              customer_account:
                summary: Customer Account Registration
                description: Register a regular customer account for shopping and order creation
                value:
                  email: "user1@example.com"
                  password: "password123"
                  name: "John Doe"
              admin_account:
                summary: Admin Account Registration
                description: Register an admin account (email contains 'admin' for automatic admin privileges)
                value:
                  email: "admin@example.com"
                  password: "admin123"
                  name: "Admin User"
      responses:
        '201':
          description: User created successfully. Returns user object and JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User created"
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: JWT access token (valid for 7 days)
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Invalid input - email format invalid or missing required fields
        '409':
          description: Conflict - email already registered
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login and get access token (User or Admin)
      description: |
        Authenticate with email and password to receive a JWT access token. This endpoint supports both **user login** and **admin login**.
        
        **User Login (Customer):**
        - Use customer account credentials (e.g., `user1@example.com`)
        - Returns a JWT token for accessing customer endpoints (Products, Cart, Checkout, Orders, Addresses)
        - Use this token to browse products, manage cart, create orders, and view your own orders
        
        **Admin Login (Administrator):**
        - Use admin account credentials (email containing 'admin' or listed in ADMIN_EMAILS)
        - Returns a JWT token with admin privileges
        - Use this token to access ALL customer endpoints PLUS admin endpoints (`/admin/*`)
        - Admin endpoints allow order processing and status updates
        
        **Important Notes:**
        - Token expires in 7 days
        - Include token in Authorization header as `Bearer {token}` for protected endpoints
        - The same login endpoint is used for both user and admin - the role is determined by the email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  description: |
                    Email address of registered user or admin.
                    - For customer login: Use customer email (e.g., `user1@example.com`)
                    - For admin login: Use admin email containing 'admin' (e.g., `admin@example.com`)
                password:
                  type: string
                  format: password
                  description: User's password (plain text, will be verified against hashed password)
            examples:
              user_login:
                summary: Customer Login
                description: Login as a regular customer to access shopping and order creation features
                value:
                  email: "user1@example.com"
                  password: "password1"
              admin_login:
                summary: Admin Login
                description: Login as an administrator to access order processing and management features
                value:
                  email: "admin@example.com"
                  password: "admin123"
      responses:
        '200':
          description: Authenticated successfully. Returns JWT token and user object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token (valid for 7 days, use in Authorization header)
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - invalid email or password
  /products:
    get:
      tags:
        - Products
      summary: List all products with filters, pagination, and sorting
      description: |
        Retrieve a paginated list of all available products. Supports optional filtering by category, search term, price range, sorting, and pagination.
        **Note:** Available categories include: books, wellness, electronics, clothing, home, sports, accessories.
        All query parameters are optional - omit them to get all products with default pagination.
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by product category (e.g., 'books', 'electronics', 'wellness', 'clothing', 'home', 'sports', 'accessories')
        - name: search
          in: query
          schema:
            type: string
          description: Search products by name or description (case-insensitive partial match)
        - name: min_price
          in: query
          schema:
            type: number
          description: Minimum price filter (inclusive)
        - name: max_price
          in: query
          schema:
            type: number
          description: Maximum price filter (inclusive)
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, name_asc, name_desc, rating_desc, newest]
          description: Sort order (price_asc, price_desc, name_asc, name_desc, rating_desc, newest)
          example: price_asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page (max 100)
          example: 20
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        description: Total number of products matching filters
                        example: 45
                      total_pages:
                        type: integer
                        example: 3
              example:
                products:
                  - id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
                    name: "Worry Management"
                    description: "A book to help manage stress."
                    price: 91.37
                    category: "books"
                    image_url: "https://dummyimage.com/766x809"
                    stock: 94
                    average_rating: 4.5
                    review_count: 23
                    created_at: "2025-05-31T10:00:00Z"
                    updated_at: "2025-05-31T10:00:00Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 45
                  total_pages: 3
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product details by ID
      description: |
        Retrieve detailed information about a specific product by its UUID.
        **Note:** Use a valid product UUID from the products list. Returns 404 if product doesn't exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product UUID (get from /products endpoint)
          example: d412f63a-863b-45aa-abe6-0a71c29d635b
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: "d412f63a-863b-45aa-abe6-0a71c29d635b"
