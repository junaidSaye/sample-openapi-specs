  /admin/orders/{orderId}/status:
    patch:
      tags:
        - Admin
      summary: Update order status (Admin only)
      description: |
        Update the status of an order following the strict sequential flow. This is the **primary admin endpoint** for order processing.
        
        **Requires Admin Login:**
        - You must login using `/auth/login` with an admin account
        - Sample admin credentials: `admin@example.com` / `admin123`
        - Use the admin bearer token in the Authorization header
        - Regular customer accounts cannot access this endpoint
        
        **Order Status Workflow:**
        The status transitions must follow this strict sequence:
        1. `pending` (order created by customer)
        2. `invoiced` (admin generates invoice)
        3. `dispatched` (order shipped from warehouse)
        4. `in_transit` (order in transit to customer)
        5. `out_for_delivery` (order out for final delivery)
        6. `delivered` (order delivered to customer)
        
        **Important Notes:**
        - Status transitions must follow the sequence above - skipping steps will return 400 error
        - Invalid transitions (e.g., pending → delivered) will return 400 error with valid next statuses
        - Timestamp fields are automatically set based on the new status (e.g., `invoiced_at`, `dispatched_at`)
        - Provide `invoice_number` when status is 'invoiced'
        - Provide `tracking_number` when status is 'dispatched'
        - A status history record is automatically created for audit trail
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order UUID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [invoiced, dispatched, in_transit, out_for_delivery, delivered]
                  description: New status (must be a valid next status in the sequence)
                invoice_number:
                  type: string
                  description: Optional invoice number (typically set when status is 'invoiced')
                  example: "INV-2025-001"
                tracking_number:
                  type: string
                  description: Optional tracking number (typically set when status is 'dispatched')
                  example: "TRACK123456789"
                notes:
                  type: string
                  description: Optional admin notes about the status change
                  example: "Invoice generated and sent to customer"
            example:
              status: "invoiced"
              invoice_number: "INV-2025-001"
              notes: "Invoice generated"
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: "o1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                user_id: "u1b2c3d4-e5f6-4789-a012-b3c4d5e6f789"
                total_amount: 182.74
                status: "invoiced"
                invoice_number: "INV-2025-001"
                invoiced_at: "2025-05-31T11:00:00Z"
                created_at: "2025-05-31T10:00:00Z"
                updated_at: "2025-05-31T11:00:00Z"
        '400':
          description: Bad request - invalid status or invalid status transition
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid status transition"
                  currentStatus:
                    type: string
                    example: "pending"
                  attemptedStatus:
                    type: string
                    example: "delivered"
                  validNextStatuses:
                    type: array
                    items:
                      type: string
                    example: ["invoiced"]
        '403':
          description: Forbidden - admin access required
        '404':
          description: Order not found
  /admin/orders/{orderId}/history:
    get:
      tags:
        - Admin
      summary: Get order status history (Admin or order owner)
      description: |
        Retrieve the complete status change history for a specific order.
        
        **Access Control:**
        - **Admin Login Required**: Admins can view history of any order
          - Login with admin account (e.g., `admin@example.com`)
          - Use admin bearer token in Authorization header
        - **Customer Access**: Regular users can only view history of their own orders
